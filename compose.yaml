# Local development database only. Not a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_trading
      POSTGRES_USER: crypto_trading
      POSTGRES_PASSWORD: ${CTS_DB_PASSWORD:?set CTS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cts-pgdata:/var/lib/postgresql/data
volumes:
  cts-pgdata:
